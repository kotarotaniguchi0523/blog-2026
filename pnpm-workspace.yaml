nodeLinker: hoisted
preferSymlinkedExecutables: false
allowBuilds:
  esbuild@0.28.2: true
minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.10'
  - '@astrojs/react-renderer@0.1.3'
  - '@astrojs/react@7.1.9'
  - '@astrojs/vite-plugin-astro@0.1.3'
  - astro@7.4.12
# Refuse a package version whose publish trust (trusted publisher / provenance) is
# weaker than an earlier release of the same package.
trustPolicy: no-downgrade
peerDependencyRules:
  allowedVersions:
    # @fumapress/astro 0.1.0 declares ^0.2.1, but @fumadocs/astro 0.2.x needs
    # @fumadocs/satteri 0.7, which imports createShowContext, removed in
    # fumadocs-core 16.19.0. 0.3.0 (same release as 16.19.0) keeps the API that
    # @fumapress/astro uses (default export, NoProcessedMarkdownError). Upstream main
    # already declares ^0.3.0 (fuma-nama/fumapress@20c5476, unreleased): remove this
    # once a release includes it.
    '@fumapress/astro>@fumadocs/astro': '0.3.0'
